<!DOCTYPE html>
<html>
<head>
    <style>
        table {
            border-collapse: collapse;
            width: 60%;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #333;
            padding: 8px 12px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<h2>Fruit Classification</h2>

<table>
    <tr>
        <th>Fruit</th>
        <th>Classification</th>
    </tr>
    <tr>
        <td>Apple</td>
        <td>Pome Fruit</td>
    </tr>
    <tr>
        <td>Grape</td>
        <td>Berry Fruit</td>
    </tr>
    <tr>
        <td>Mango</td>
        <td>Drupe (Stone Fruit)</td>
    </tr>
    <tr>
        <td>Banana</td>
        <td>Berry Fruit</td>
    </tr>
    <tr>
        <td>Blackberry</td>
        <td>Aggregate Fruit</td>
    </tr>
    <tr>
        <td>Almond</td>
        <td>Nut / Seed</td>
    </tr>
</table>

</body>
</html>
