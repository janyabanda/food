<!DOCTYPE html>
<html>
<head>
  <title>Fruit Table Styles</title>
</head>
<body>
  <table border="1" cellpadding="10">
    <tr>
      <th>Fruit</th>
      <th>Style Example</th>
    </tr>
    <tr>
      <td>Apple</td>
      <td><b>Bold Text</b></td>
    </tr>
    <tr>
      <td>Mango</td>
      <td><i>Italic Text</i></td>
    </tr>
    <tr>
      <td>Banana</td>
      <td><u>Underlined Text</u></td>
    </tr>
    <tr>
      <td>Grapes</td>
      <td><span style="color:purple;">Colored Text</span></td>
    </tr>
    <tr>
      <td>Peach</td>
      <td><span style="font-size:20px;">Large Text</span></td>
    </tr>
    <tr>
      <td>Apricot</td>
      <td><span style="font-family:Courier;">Different Font</span></td>
    </tr>
  </table>
</body>
</html>
